name: Application bug report
description: Report a problem with the application itself
title: "[APP BUG]: "
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing report of this problem.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the steps needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, CPU, GPU, RAM, and application version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and additional context
      description: Attach relevant logs, screenshots, or other details.
