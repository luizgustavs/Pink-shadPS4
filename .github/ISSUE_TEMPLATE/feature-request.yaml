name: Feature request
description: Suggest a new feature or an improvement
title: "[FEATURE]: "
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing request for this feature.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem or limitation this request would address.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how you would like the feature to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and additional context
      description: Describe alternatives, examples, or other relevant information.
