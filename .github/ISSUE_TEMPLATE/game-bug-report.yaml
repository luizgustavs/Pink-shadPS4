name: Game emulation bug report
description: Report an emulation problem affecting a game
title: "[GAME BUG]: "
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing report of this problem.
          required: true
        - label: I reproduced the problem without mods, patches, or cheats.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the emulation problem clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the steps needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: game
    attributes:
      label: Game information
      description: Include the game title, region, version, and update version.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, CPU, GPU, RAM, VRAM, and application version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and additional context
      description: Attach the complete log and any relevant screenshots or recordings.
    validations:
      required: true
