name: Request for comments
description: Propose a significant technical or architectural change
title: "[RFC]: "
labels: ["RFC"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing issue or RFC covering this proposal.
          required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Explain the problem and why it is worth addressing.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the proposed change, affected areas, and important constraints.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: Describe other approaches considered and their tradeoffs.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add diagrams, migration notes, references, or other relevant information.
